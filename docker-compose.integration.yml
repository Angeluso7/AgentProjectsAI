version: '3.8'

services:
  postgres_test_db:
    image: postgis/postgis:16-3.4
    container_name: plan_review_postgres_test
    environment:
      POSTGRES_DB: planreview_test
      POSTGRES_USER: postgres_migrator
      POSTGRES_PASSWORD: migrator_secure_pass_123
    ports:
      - "5433:5432"
    volumes:
      - ./migrations/rls_prepared_policies.sql:/docker-entrypoint-initdb.d/99_rls_policies.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_migrator -d planreview_test"]
      interval: 3s
      timeout: 3s
      retries: 10
