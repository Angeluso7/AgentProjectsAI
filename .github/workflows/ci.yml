name: CI Quality Gates

'on':
  push:
    branches: [ main, master, develop, 'chore/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master, develop, 'chore/**', 'feat/**', 'fix/**' ]

jobs:
  frontend-gates:
    name: Frontend Quality Gates (Smoke Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - Frontend Smoke Test & TypeScript Typecheck
        run: npm run test:smoke

      - name: Gate 2 - Production Build (Strict Compilation)
        run: npm run build

  backend-gates:
    name: Backend Quality Gates (Integration Journey Suite & PostgreSQL Validation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres_migrator
          POSTGRES_PASSWORD: migrator_secure_pass_123
          POSTGRES_DB: planreview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_migrator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic pydantic pydantic-settings pytest httpx bcrypt argon2-cffi pymupdf pillow "psycopg[binary]" email-validator python-multipart opencv-python-headless numpy rapidfuzz anthropic

      - name: Gate 3 - Backend Integration & Functional Journey Tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest tests/integration/test_functional_validation_journey.py tests/integration/test_plan_selections_incorporation.py tests/integration/test_document_deletion.py tests/integration/test_information_acquisition_and_web_first_flow.py tests/integration/test_knowledge_base_operational.py tests/integration/test_project_maturity_and_acquisition_route.py tests/integration/test_canonical_piping_symbol_catalog.py tests/integration/test_document_upload_and_batch_flow.py -v --disable-warnings

      - name: Gate 4 - PostgreSQL Migration Upgrade, Downgrade & Lifecycle Validation
        working-directory: .
        run: |
          python backend/scripts/validate_canonical_symbol_catalog_postgres.py postgresql+psycopg://postgres_migrator:migrator_secure_pass_123@localhost:5432/planreview_test

      - name: Gate 5 - Piping Symbol Canonical Catalog on Real PostgreSQL
        env:
          TEST_DATABASE_URL: 'postgresql+psycopg://postgres_migrator:migrator_secure_pass_123@localhost:5432/planreview_test'
        run: pytest tests/integration/test_canonical_piping_symbol_catalog.py -v --disable-warnings

      - name: Gate 6 - One-Click Review Taxonomy & Sandbox/Production Contract on Real PostgreSQL
        env:
          DATABASE_URL: 'postgresql+psycopg://postgres_migrator:migrator_secure_pass_123@localhost:5432/planreview_test'
          TEST_DATABASE_URL: 'postgresql+psycopg://postgres_migrator:migrator_secure_pass_123@localhost:5432/planreview_test'
        run: pytest tests/integration/test_one_click_review_orchestrator.py -v --disable-warnings

