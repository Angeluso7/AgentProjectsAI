name: CI Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend-gates:
    name: Frontend Quality Gates (Smoke Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - Frontend Smoke Test & TypeScript Typecheck
        run: npm run test:smoke

      - name: Gate 2 - Production Build (Strict Compilation)
        run: npm run build

  backend-gates:
    name: Backend Quality Gates (Integration Journey Suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic pydantic pydantic-settings pytest httpx bcrypt argon2-cffi pymupdf pillow

      - name: Gate 3 - Backend Integration & Functional Journey Tests
        run: pytest tests/integration/test_functional_validation_journey.py tests/integration/test_plan_selections_incorporation.py tests/integration/test_document_deletion.py tests/integration/test_information_acquisition_and_web_first_flow.py tests/integration/test_knowledge_base_operational.py tests/integration/test_project_maturity_and_acquisition_route.py -v --disable-warnings

