[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-review-ai-hybrid"
version = "0.3.0"
description = "Hybrid AI platform for PDF drawing review"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "pymupdf",
  "pdfplumber",
  "opencv-python",
  "pillow",
  "numpy",
  "pandas",
  "shapely",
  "networkx",
  "rapidfuzz",
  "jinja2",
  "weasyprint",
  "pytesseract",
  "paddleocr",
  "ultralytics",
  "torch",
  "torchvision",
  "mlflow",
  "dvc",
  "faiss-cpu",
  "httpx",
  "pytest",
  "argon2-cffi",
  "email-validator",
  "python-multipart",
  "ezdxf",
  "qdrant-client"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "pytest-asyncio"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "postgres: Pruebas de integración reales contra motor PostgreSQL 15+ con RLS activo",
  "integration: Pruebas de integración de servicios y bases de datos",
  "unit: Pruebas unitarias rápidas aisladas en memoria"
]
