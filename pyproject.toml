[project]
name = "plan-review-ai-hybrid"
version = "0.2.0"
description = "Hybrid AI platform for PDF drawing review"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "pymupdf",
  "pdfplumber",
  "opencv-python",
  "pillow",
  "numpy",
  "pandas",
  "shapely",
  "networkx",
  "rapidfuzz",
  "jinja2",
  "weasyprint",
  "pytesseract",
  "paddleocr",
  "ultralytics",
  "torch",
  "torchvision",
  "mlflow",
  "dvc",
  "faiss-cpu"
]
